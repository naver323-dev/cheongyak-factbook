name: 데이터 갱신·배포

on:
  schedule:
      - cron: "0 20 * * *"
        workflow_dispatch:

        permissions:
          contents: write

          concurrency:
            group: refresh
              cancel-in-progress: false

              jobs:
                refresh:
                    runs-on: ubuntu-latest
                        steps:
                              - uses: actions/checkout@v4
                                    - uses: actions/setup-python@v5
                                            with:
                                                      python-version: "3.12"
                                                            - name: 원본 내려받기 (실패해도 스냅샷으로 계속)
                                                                    run: python3 scripts/fetch.py || echo "::warning::원본 내려받기 실패 - 스냅샷으로 빌드합니다"
                                                                            continue-on-error: true
                                                                                  - name: 최근 공고 단지명·소재지 보완
                                                                                          run: python3 scripts/fetch_details.py || echo "::warning::상세 보완 실패 - 캐시로 계속합니다"
                                                                                                  continue-on-error: true
                                                                                                        - name: 단위 테스트
                                                                                                                run: python3 -m unittest discover -s tests
                                                                                                                      - name: 사이트 빌드
                                                                                                                              run: python3 scripts/build.py
                                                                                                                                    - name: 산출물 검증
                                                                                                                                            run: python3 scripts/check.py
                                                                                                                                                  - name: 변경분 커밋·푸시
                                                                                                                                                          run: |
                                                                                                                                                                    git config user.name "cheongyak-data-bot"
                                                                                                                                                                              git config user.email "actions@users.noreply.github.com"
                                                                                                                                                                                        git add -A
                                                                                                                                                                                                  if git diff --cached --quiet; then
                                                                                                                                                                                                              echo "변경 없음 - 배포 생략"
                                                                                                                                                                                                                          exit 0
                                                                                                                                                                                                                                    fi
                                                                                                                                                                                                                                              git commit -m "chore: 데이터 갱신 $(date -u +%Y-%m-%d) [skip ci]"
                                                                                                                                                                                                                                                        git push
                                                                                                                                                                                                                                                        
